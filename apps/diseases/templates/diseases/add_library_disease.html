{% load i18n %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Disease</title>
    <style>
        body { font-family: Arial; padding: 40px; }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .tab {
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-bottom: none;
            background: #f1f1f1;
        }

        .tab.active {
            background: white;
            font-weight: bold;
        }

        .tab-content {
            border: 1px solid #ccc;
            padding: 20px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Add Disease</h2>

<form method="POST">
    {% csrf_token %}

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" onclick="showTab('en')">English</div>
        <div class="tab" onclick="showTab('hi')">Hindi</div>
        <div class="tab" onclick="showTab('te')">Telugu</div>
    </div>

    <!-- English -->
    <div id="en" class="tab-content active">
        <input type="text" name="name_en" placeholder="Disease Name (English)" required>
        <textarea name="causes_en" placeholder="Causes (English)" required></textarea>
        <textarea name="symptoms_en" placeholder="Symptoms (English)" required></textarea>
        <textarea name="treatment_en" placeholder="Treatment (English)" required></textarea>
    </div>

    <!-- Hindi -->
    <div id="hi" class="tab-content">
        <input type="text" name="name_hi" placeholder="Disease Name (Hindi)" required>
        <textarea name="causes_hi" placeholder="Causes (Hindi)" required></textarea>
        <textarea name="symptoms_hi" placeholder="Symptoms (Hindi)" required></textarea>
        <textarea name="treatment_hi" placeholder="Treatment (Hindi)" required></textarea>
    </div>

    <!-- Telugu -->
    <div id="te" class="tab-content">
        <input type="text" name="name_te" placeholder="Disease Name (Telugu)" required>
        <textarea name="causes_te" placeholder="Causes (Telugu)" required></textarea>
        <textarea name="symptoms_te" placeholder="Symptoms (Telugu)" required></textarea>
        <textarea name="treatment_te" placeholder="Treatment (Telugu)" required></textarea>
    </div>

    <br>

    <!-- Common Fields -->
    <select name="category" required>
        <option value="viral">Viral</option>
        <option value="bacterial">Bacterial</option>
        <option value="fungal">Fungal</option>
        <option value="genetic">Genetic</option>
        <option value="chronic">Chronic</option>
        <option value="skin">Skin</option>
        <option value="other">Other</option>
    </select>

    <button type="submit">Submit</button>
</form>

<script>
function showTab(lang, element) {
    let tabs = document.querySelectorAll('.tab');
    let contents = document.querySelectorAll('.tab-content');

    tabs.forEach(tab => tab.classList.remove('active'));
    contents.forEach(content => content.classList.remove('active'));

    document.getElementById(lang).classList.add('active');
    element.classList.add('active');
}
</script>


</body>
</html>
