{% load i18n %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Disease Alert</title>

    <style>
        body { font-family: Arial; padding: 40px; }

        .tabs { display: flex; margin-bottom: 20px; cursor: pointer; }

        .tab {
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-bottom: none;
            background: #f1f1f1;
        }

        .tab.active {
            background: white;
            font-weight: bold;
        }

        .tab-content {
            border: 1px solid #ccc;
            padding: 20px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            background: red;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<h2>Add Disease Alert</h2>

<form method="POST" action="{% url 'add_disease' %}">
    {% csrf_token %}


    <div class="tabs">
        <div class="tab active" onclick="showTab('en', this)">English</div>
<div class="tab" onclick="showTab('hi', this)">Hindi</div>
<div class="tab" onclick="showTab('te', this)">Telugu</div>

    </div>

    <div id="en" class="tab-content active">
    <input type="text" name="title_en" placeholder="Title (English)" required>
    <textarea name="description_en" placeholder="Description (English)" required></textarea>
</div>

<div id="hi" class="tab-content">
    <input type="text" name="title_hi" placeholder="Title (Hindi)">
    <textarea name="description_hi" placeholder="Description (Hindi)"></textarea>
</div>

<div id="te" class="tab-content">
    <input type="text" name="title_te" placeholder="Title (Telugu)">
    <textarea name="description_te" placeholder="Description (Telugu)"></textarea>
</div>


    <input type="text" name="location" placeholder="Location" required>

    <button type="submit">Send Alert</button>
</form>

<script>
function showTab(lang, element) {
    let tabs = document.querySelectorAll('.tab');
    let contents = document.querySelectorAll('.tab-content');

    // remove active classes
    tabs.forEach(tab => tab.classList.remove('active'));
    contents.forEach(content => content.classList.remove('active'));

    // add active to selected tab
    document.getElementById(lang).classList.add('active');
    element.classList.add('active');

    // Remove required from all inputs first
    document.querySelectorAll('input, textarea').forEach(field => {
        field.removeAttribute('required');
    });

    // Add required only to current tab inputs
    document.querySelectorAll('#' + lang + ' input, #' + lang + ' textarea').forEach(field => {
        field.setAttribute('required', true);
    });
}
</script>


</body>
</html>
